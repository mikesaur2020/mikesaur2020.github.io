<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DMSaur — Ideas are easy. Shipping is the adventure.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#efe9dd"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6079"/>
      <stop offset="1" stop-color="#2e4a5e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- ridge line motif -->
  <path d="M0,470 L180,400 L360,455 L560,360 L760,440 L980,345 L1200,420 L1200,630 L0,630 Z"
        fill="#3d6079" fill-opacity="0.14"/>
  <path d="M0,520 L200,470 L420,515 L640,430 L860,500 L1080,425 L1200,470 L1200,630 L0,630 Z"
        fill="#3d6079" fill-opacity="0.24"/>

  <!-- brand mark -->
  <g transform="translate(96,120)">
    <rect width="96" height="96" rx="22" fill="url(#mark)"/>
    <path d="M14 74 L36 38 L48 56 L60 30 L82 74 Z" fill="#f7f4ee"/>
  </g>
  <text x="212" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" fill="#23271f" letter-spacing="-1">DMSaur</text>

  <!-- headline -->
  <text x="96" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" fill="#23271f" letter-spacing="-2">Ideas are easy.</text>
  <text x="96" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" fill="#3d6079" letter-spacing="-2">Learning is the adventure.</text>

  <text x="98" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500" fill="#474c40">DMSaur · builder of practical tools</text>
</svg>
